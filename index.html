    --bg:#F3F5F8; --card:#FFFFFF; --text:#141A2E; --muted:#667085; --line:#E1E5EC;
    --accent:#0089B5; --ot:#253994; --warn:#E8590C; --danger:#E03131;
    --ok-bg:#E6F9EE; --ok-ink:#04893B; --hol-bg:#FFF0E6; --bad-bg:#FFE3E3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0E1220; --card:#171C2E; --text:#EEF1F7; --muted:#9AA3B5; --line:#272E44; --ot:#4A63D8;
      --ok-bg:#12321F; --ok-ink:#5BE08F; --hol-bg:#3A2414; --bad-bg:#3B1A1A; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
  /* 公司橫幅（永遠白底，logo 原色才清楚） */
  .brand{position:relative;overflow:hidden;border-radius:14px;margin-bottom:12px;padding:14px 16px 12px;
    background:#fff;color:var(--navy);border:1px solid #DCE3F0;box-shadow:0 2px 10px rgba(23,38,109,.06)}
  .brand::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(0,160,204,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(0,160,204,.09) 1px,transparent 1px);
    background-size:16px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 100%);mask-image:linear-gradient(90deg,transparent 35%,#000 100%)}
  .brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,var(--navy),var(--brand) 45%,var(--cyan))}
  .brand-top{position:relative;display:flex;align-items:center;gap:12px}
  .brand-sym{width:46px;height:46px;flex:none}
  .brand-name{min-width:0;flex:1}
  .brand-word{display:block;width:100%;max-width:230px;height:auto}
  .brand-en2{font-family:"Space Age","Eurostile","Arial",sans-serif;font-size:17px;letter-spacing:.18em;-webkit-text-stroke:.3px currentColor;color:var(--cyan);margin-top:5px;white-space:nowrap}
  .brand-row{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    margin-top:11px;padding-top:9px;border-top:1px solid #E6EBF3}
  #company{font-family:"DFKai-SB","BiauKai","標楷體","LG Kai",serif;font-size:17px;letter-spacing:.22em;color:var(--navy);font-weight:400}
  #who{font-weight:700;font-size:14px;color:var(--brand);white-space:nowrap}
  #who:not(:empty)::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
    background:var(--cyan);box-shadow:0 0 0 3px rgba(0,160,204,.18);vertical-align:1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .hero{text-align:center}
  #date{color:var(--muted);font-size:14px}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px;background:var(--ok-bg);color:var(--ok-ink)}
  .badge.holiday{background:var(--hol-bg);color:var(--warn)}
  #clock{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:4px 0}
  #status{font-size:14px;color:var(--muted)}
  .tip{font-size:13px;color:var(--warn);background:var(--hol-bg);border-radius:10px;padding:8px 12px;margin-bottom:12px}
  h2{font-size:14px;color:var(--muted);font-weight:600;margin:18px 4px 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;border:0;cursor:pointer;color:inherit}
  .pbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 8px;font-size:17px;font-weight:700}
  .pbtn small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
  .pbtn.next{background:var(--accent);border-color:var(--accent);color:#fff}
  .pbtn.ot.next{background:var(--ot);border-color:var(--ot)}
  .pbtn.next small{color:rgba(255,255,255,.85)}
  .block{display:block;width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:700;background:var(--accent);color:#fff}
  .block.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
  body.busy button{pointer-events:none;opacity:.55}
  input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  textarea{resize:vertical;margin:10px 0}
  .mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .mname{font-size:18px;font-weight:700}
  .muted{color:var(--muted);font-size:13px}
  .x{background:none;font-size:18px;padding:4px 8px;color:var(--muted)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .seg input{display:none}
  .seg span{display:block;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);font-weight:700}
  .seg input:checked + span{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-ink)}
  .seg input[value="異常"]:checked + span{background:var(--bad-bg);color:var(--danger);border-color:var(--danger)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip input{display:none}
  .chip span{display:inline-block;padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px}
  .chip input:checked + span{background:var(--bad-bg);color:var(--danger);border-color:var(--danger)}
  .records{list-style:none;margin:0;padding:0}
  .records li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .records li:last-child{border-bottom:0}
  .records .t{font-variant-numeric:tabular-nums;color:var(--muted);min-width:44px}
  .records li.bad .d{color:var(--danger)}
  .records li.empty{color:var(--muted);justify-content:center}
  #toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;
    padding:12px 14px;border-radius:12px;background:#1B1F1D;color:#fff;font-size:15px;text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
  #toast.show{opacity:1;transform:none}
  #toast.err{background:var(--danger)} #toast.warn{background:var(--warn)} #toast.ok{background:var(--navy)}
  #loading{text-align:center;color:var(--muted);padding:60px 0}
  /* 外勤打卡視窗 */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet .panel{width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .sheet h3{margin:0 0 4px;font-size:18px}
  #rReasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
  #rReasons input{display:none}
  #rReasons span{display:block;text-align:center;padding:11px;border-radius:10px;border:1px solid var(--line);font-weight:700}
  #rReasons input:checked + span{background:#E7EEFF;color:var(--ot);border-color:var(--ot)}
  @media (prefers-color-scheme: dark){ #rReasons input:checked + span{background:#1C2647} }
  .row2{display:grid;grid-template-columns:1fr 2fr;gap:8px}
  .records li.remote .d{color:var(--ot)}
  /* 請假 */
  .fld{display:block;margin-top:10px}
  .fld > span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .fld input,.fld select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-height:44px}
  .dt{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
  #lvHours{margin-top:8px;font-size:14px;color:var(--ot);font-weight:700;min-height:20px}
  .lvlist{list-style:none;margin:0;padding:0}
  .lvlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .lvlist li:last-child{border-bottom:0}
  .lvlist .w{color:var(--muted);font-size:12px;margin-top:2px}
  .st{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--hol-bg);color:var(--warn)}
  .st.ok{background:var(--ok-bg);color:var(--ok-ink)} .st.no{background:var(--bad-bg);color:var(--danger)}
  .lvlist li.empty{color:var(--muted);justify-content:center}
  /* 薪資總覽 */
  .payhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .payhead select{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .paytot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .paytot div{background:var(--bg);border-radius:10px;padding:10px 12px}
  .paytot b{display:block;font-size:20px;font-variant-numeric:tabular-nums;color:var(--ot)}
  .paytot span{font-size:12px;color:var(--muted)}
  .paylist{list-style:none;margin:10px 0 0;padding:0}
  .paylist > li{border-top:1px solid var(--line)}
  .paylist summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 2px;cursor:pointer}
  .paylist summary::-webkit-details-marker{display:none}
  .paylist summary .n{font-weight:700}
  .paylist summary .n small{font-weight:400;color:var(--muted);margin-left:6px}
  .paylist summary .net{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .paylist summary .net::after{content:"▸";display:inline-block;width:12px;margin-left:8px;color:var(--muted);font-size:13px}
  .paylist details[open] summary .net::after{content:"▾"}
  .paydet{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:0 2px 12px;font-size:14px}
  .paydet h4{margin:6px 0 2px;font-size:12px;color:var(--muted);font-weight:600}
  .paydet .kv{display:flex;justify-content:space-between;gap:6px}
  .paydet .kv b{font-weight:600;font-variant-numeric:tabular-nums}
  .paydet .kv.sum{border-top:1px solid var(--line);padding-top:4px;margin-top:2px;font-weight:700}
  .paydet .note{grid-column:1 / -1;font-size:12px;color:var(--warn);background:var(--hol-bg);border-radius:8px;padding:6px 8px;margin-top:6px}
  .paydet .meta{grid-column:1 / -1;font-size:12px;color:var(--muted);margin-top:4px}
  [hidden]{display:none !important}
</style>
</head>

    <!-- 只有「可看薪資」的人看得到 -->
    <section id="paySection" hidden>
      <h2>薪資總覽（僅限授權人員）</h2>
      <div class="card">
        <div class="payhead">
          <select id="payMonth" aria-label="月份"></select>
          <span id="payGen" class="muted"></span>
        </div>
        <div id="payBody"></div>
      </div>
    </section>
  </section>
</div>
<div id="toast"></div>

<!-- 請假申請 -->
<div id="leaveSheet" class="sheet" hidden>
  <div class="panel">
    <h3>請假申請</h3>
    <div id="lvWork" class="muted"></div>
    <label class="fld"><span>假別</span><select id="lvType"></select></label>
    <label class="fld"><span>開始</span><div class="dt"><input id="lvSD" type="date"><input id="lvST" type="time" step="1800"></div></label>
    <label class="fld"><span>結束</span><div class="dt"><input id="lvED" type="date"><input id="lvET" type="time" step="1800"></div></label>
    <div id="lvHours"></div>
    <textarea id="lvReason" rows="2" maxlength="200" placeholder="事由（必填）"></textarea>
    <div class="row2">
      <button id="lvCancel" class="block ghost">取消</button>
      <button id="lvSubmit" class="block">送出申請</button>
    </div>
  </div>
</div>

<!-- 外勤打卡（不在公司範圍時跳出） -->
<div id="remoteSheet" class="sheet" hidden>
  <div class="panel">
    <h3 id="rTitle">外勤打卡</h3>
    <div id="rDist" class="muted"></div>
    <div id="rReasons"></div>
    <textarea id="rNote" rows="2" maxlength="200" placeholder="說明（必填）：地點、客戶或課程名稱"></textarea>
    <label class="fld" style="margin:0 0 12px"><span>油程公里數（來回合計，選填；同一趟只要填一次）</span>
      <input id="rKm" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例如 35"></label>
    <div class="row2">
      <button id="rCancel" class="block ghost">取消</button>
      <button id="rSubmit" class="block">送出外勤打卡</button>
    </div>
  </div>
</div>

<script>
/* ====== 只需要改這兩行 ====== */
const LIFF_ID = '2012074295-EES3q5iW';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz5Gazi-NR58_ofkMOYBjb9blf_paqfI6hYaeDSN7PPTe95dU_DI67J8ZCj7CdvHCEa8g/exec';
/* ========================== */

const T = { IN:'上班', LUNCH_OUT:'午休開始', LUNCH_IN:'午休結束', OUT:'下班', OT_IN:'加班開始', OT_OUT:'加班結束' };
const $ = (id) => document.getElementById(id);
const S = { dayType:'平日', machine:null, busy:false, records:{ punches:[], inspections:[], otOpen:false },
  remoteReasons:['出差','上課','拜訪客戶','其他'], pending:null,
  leaveTypes:['特休','事假','病假'], workTime:{ start:'08:00', end:'17:00' } };

window.addEventListener('load', main);

async function main(){
  tick(); setInterval(tick, 1000);
  try{
    if (LIFF_ID.startsWith('YOUR') || GAS_URL.startsWith('YOUR')) throw new Error('請先在 index.html 填入 LIFF_ID 與 GAS_URL');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    await boot();
  }catch(e){ fatal(e.message); }
}

async function boot(){
  const machineId = new URLSearchParams(location.search).get('machine');
  const r = await api('bootstrap', { machineId });
  // 中文公司名稱固定顯示「隆基精密工業」
  show('loading', false);

  if (!r.bound){
    $('bindHello').textContent = `${r.lineName || ''} 您好！第一次使用請輸入管理員給您的綁定碼。`;
    show('bindView', true);
    return;
  }

  $('who').textContent = r.emp.name;
  S.dayType = r.dayType;
  if (r.remoteReasons && r.remoteReasons.length) S.remoteReasons = r.remoteReasons;
  if (r.leaveTypes && r.leaveTypes.length) S.leaveTypes = r.leaveTypes;
  if (r.workTime) S.workTime = r.workTime;
  setLeaves(r.leaves);
  if (r.canViewPay){ $('paySection').hidden = false; loadPay(''); }
  $('date').textContent = `${r.date}（${r.weekday}）`;
  const b = $('dayBadge');
  b.textContent = r.dayType;
  b.classList.toggle('holiday', r.dayType === '假日');
  $('otTitle').textContent = r.dayType + '加班';
  $('otHint1').textContent = $('otHint2').textContent = r.dayType + '加班';
  if (r.dayType === '假日'){
    const att = $('attSection');
    att.parentNode.insertBefore($('otSection'), att);
    $('holidayTip').hidden = false;
  }

  setRecords(r.records);
  if (r.machine) openMachine(r.machine);
  else if (machineId) toast(`找不到機台「${machineId}」，請洽管理員`, 'err');
  show('mainView', true);
}

/* ---------- API ---------- */
async function api(action, data = {}){
  const idToken = liff.getIDToken();
  if (!idToken) throw new Error('無法取得 LINE 身分，請從 LINE 開啟此頁面');
  let res;
  try{
    // 不設 Content-Type（預設 text/plain），避免 CORS 預檢，Apps Script 才收得到
    const r = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action, idToken, ...data }) });
    res = await r.json();
  }catch(_){
    throw new Error('無法連線到後端，請確認網路，或請管理員檢查 GAS_URL 與部署權限');
  }
  if (!res.ok){
    const e = new Error(res.error || '發生錯誤');
    e.code = res.code; e.dist = res.dist;
    throw e;
  }
  return res;
}

async function run(fn){
  if (S.busy) return;
  S.busy = true; document.body.classList.add('busy');
  try{ await fn(); }
  catch(e){ toast(e.message, 'err'); }
  finally{ S.busy = false; document.body.classList.remove('busy'); }
}

function getPosition(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('此裝置不支援定位'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy) }),
      err => reject(new Error(err.code === 1
        ? '請允許定位權限（手機「設定」→ LINE → 位置 → 使用期間）'
        : '定位失敗，請確認 GPS 已開啟後再試一次')),
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  });
}

/* ---------- 綁定 ---------- */
$('bindBtn').onclick = () => run(async () => {
  const code = $('bindCode').value.trim();
  if (!code) throw new Error('請輸入綁定碼');
  const r = await api('bind', { code });
  toast(`綁定成功：${r.name}`, 'ok');
  show('bindView', false); show('loading', true);
  await boot();
});

/* ---------- 打卡 ---------- */
document.querySelectorAll('[data-type]').forEach(btn => {
  btn.onclick = () => punch(btn.dataset.type);
});

function punch(type){
  const label = type.startsWith('加班') ? S.dayType + type : type;
  if (!confirm(`確定打「${label}」卡？`)) return;
  run(async () => {
    toast('定位中…');
    const pos = await getPosition();
    let r;
    try{
      r = await api('punch', { type, ...pos });
    }catch(e){
      if (e.code !== 'OUT_OF_RANGE') throw e;
      clearTimeout(toastTimer); $('toast').className = '';
      openRemote(type, label, pos, e.dist);   // 不在公司 → 改走外勤打卡
      return;
    }
    punchDone(label, r);
  });
}

function punchDone(label, r){
  setRecords(r.records);
  const head = r.remote ? `✅ 外勤${label} 打卡成功 ${r.time}` : `✅ ${label} 打卡成功 ${r.time}`;
  toast(head + (r.warning ? `（${r.warning}）` : ''), r.warning ? 'warn' : 'ok');
}

/* ---------- 外勤打卡 ---------- */
function openRemote(type, label, pos, dist){
  S.pending = { type, label, pos };
  $('rTitle').textContent = `外勤打卡：${label}`;
  const d = dist >= 1000 ? (Math.round(dist / 100) / 10) + ' 公里' : dist + ' 公尺';
  $('rDist').textContent = `您目前不在公司範圍內（距離約 ${d}）。出差、上課等請選擇原因並填寫說明。`;
  const box = $('rReasons');
  box.innerHTML = '';
  S.remoteReasons.forEach(txt => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="radio" name="rReason"><span></span>';
    l.querySelector('input').value = txt;
    l.querySelector('span').textContent = txt;
    box.appendChild(l);
  });
  $('rNote').value = '';
  $('rKm').value = '';
  $('remoteSheet').hidden = false;
}

function closeRemote(){ S.pending = null; $('remoteSheet').hidden = true; }
$('rCancel').onclick = closeRemote;
$('remoteSheet').onclick = (e) => { if (e.target.id === 'remoteSheet') closeRemote(); };

$('rSubmit').onclick = () => run(async () => {
  const sel = document.querySelector('input[name=rReason]:checked');
  const note = $('rNote').value.trim();
  if (!sel) throw new Error('請選擇外勤原因');
  if (!note) throw new Error('請填寫說明（地點、客戶或課程名稱）');
  const p = S.pending;
  if (!p) return;
  toast('定位中…');
  const pos = await getPosition().catch(() => p.pos);  // 重新定位，失敗就用剛才的位置
  const km = Number($('rKm').value) || 0;
  if (km < 0 || km > 2000) throw new Error('油程公里數請填 0–2000');
  const r = await api('punch', { type:p.type, ...pos, remote:{ reason:sel.value, note, km } });
  closeRemote();
  punchDone(p.label, r);
});

/* ---------- 巡檢 ---------- */
$('scanBtn').onclick = () => run(async () => {
  if (!liff.isApiAvailable('scanCodeV2')) throw new Error('這裡無法開相機，請直接用 LINE 的 QR 掃描器掃機台上的 QR Code');
  const { value } = await liff.scanCodeV2();
  if (!value) return;
  let id = value.trim();
  try{
    const u = new URL(id);
    const state = u.searchParams.get('liff.state') || '';
    id = u.searchParams.get('machine')
      || new URLSearchParams(state.includes('?') ? state.split('?')[1] : '').get('machine')
      || id;
  }catch(_){ /* 不是網址，就把內容當機台編號 */ }
  const r = await api('machine', { machineId:id });
  openMachine(r.machine);
});

function openMachine(m){
  S.machine = m;
  $('mName').textContent = `${m.name}（${m.id}）`;
  $('mLoc').textContent = m.location || '';
  $('mItems').textContent = m.items.length ? '檢查項目：' + m.items.join('、') : '';
  const list = $('issueList');
  list.innerHTML = '';
  (m.items.length ? m.items : ['其他']).forEach(it => {
    const l = document.createElement('label');
    l.className = 'chip';
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.querySelector('input').value = it;
    l.querySelector('span').textContent = it;
    list.appendChild(l);
  });
  document.querySelector('input[name=result][value="正常"]').checked = true;
  $('issueBox').hidden = true;
  $('mNote').value = '';
  $('machineCard').hidden = false;
  $('scanBtn').hidden = true;
  setTimeout(() => $('machineCard').scrollIntoView({ behavior:'smooth', block:'center' }), 50);
}

function closeMachine(){
  S.machine = null;
  $('machineCard').hidden = true;
  $('scanBtn').hidden = false;
  if (location.search) history.replaceState(null, '', location.pathname);
}

$('mClose').onclick = closeMachine;
document.querySelectorAll('input[name=result]').forEach(r => {
  r.onchange = () => { $('issueBox').hidden = document.querySelector('input[name=result]:checked').value !== '異常'; };
});

$('mSubmit').onclick = () => run(async () => {
  const result = document.querySelector('input[name=result]:checked').value;
  const issues = [...$('issueList').querySelectorAll('input:checked')].map(i => i.value);
  const note = $('mNote').value.trim();
  if (result === '異常' && !issues.length && !note) throw new Error('請勾選異常項目或填寫說明');
  toast('定位中…');
  const pos = await getPosition();
  const r = await api('inspect', { machineId:S.machine.id, result, issues, note, ...pos });
  setRecords(r.records);
  closeMachine();
  toast(`✅ ${r.machine} 巡檢完成（${r.result}）`, r.result === '異常' ? 'warn' : 'ok');
});

/* ---------- 請假 ---------- */
function todayStr(){ return new Date().toLocaleDateString('sv-SE', { timeZone:'Asia/Taipei' }); }

$('leaveBtn').onclick = () => {
  const sel = $('lvType');
  sel.innerHTML = '';
  S.leaveTypes.forEach(t => { const o = document.createElement('option'); o.value = o.textContent = t; sel.appendChild(o); });
  const d = todayStr();
  $('lvSD').value = $('lvED').value = d;
  $('lvST').value = S.workTime.start; $('lvET').value = S.workTime.end;
  $('lvReason').value = '';
  $('lvWork').textContent = `上班時間 ${S.workTime.start}–${S.workTime.end}，時數會扣掉午休與假日，送出後由管理員核准。`;
  lvPreview();
  $('leaveSheet').hidden = false;
};
['lvSD','lvST','lvED','lvET'].forEach(id => $(id).addEventListener('change', () => {
  if (id === 'lvSD' && $('lvED').value < $('lvSD').value) $('lvED').value = $('lvSD').value;
  lvPreview();
}));
function lvPreview(){
  const s = `${$('lvSD').value}T${$('lvST').value}`, e = `${$('lvED').value}T${$('lvET').value}`;
  $('lvHours').textContent = (s && e && e > s) ? `${$('lvSD').value.slice(5)} ${$('lvST').value} → ${$('lvED').value.slice(5)} ${$('lvET').value}` : '結束時間必須晚於開始時間';
}
function closeLeave(){ $('leaveSheet').hidden = true; }
$('lvCancel').onclick = closeLeave;
$('leaveSheet').onclick = (e) => { if (e.target.id === 'leaveSheet') closeLeave(); };

$('lvSubmit').onclick = () => run(async () => {
  const start = `${$('lvSD').value}T${$('lvST').value}`, end = `${$('lvED').value}T${$('lvET').value}`;
  const reason = $('lvReason').value.trim();
  if (!$('lvSD').value || !$('lvST').value || !$('lvED').value || !$('lvET').value) throw new Error('請填寫開始與結束時間');
  if (end <= start) throw new Error('結束時間必須晚於開始時間');
  if (!reason) throw new Error('請填寫請假事由');
  const r = await api('leave', { leaveType:$('lvType').value, start, end, reason });
  closeLeave();
  setLeaves(r.leaves);
  toast(`✅ 已送出 ${$('lvType').value} ${r.hours} 小時，等待核准`, 'ok');
});

function setLeaves(list){
  const ul = $('leaveList');
  ul.innerHTML = '';
  if (!list || !list.length){ ul.innerHTML = '<li class="empty">沒有請假紀錄</li>'; return; }
  list.forEach(l => {
    const li = document.createElement('li');
    li.innerHTML = '<div><div class="h"></div><div class="w"></div></div><span class="st"></span>';
    li.querySelector('.h').textContent = `${l.type} ${l.hours} 小時`;
    li.querySelector('.w').textContent = `${l.start} → ${l.end}` + (l.memo ? `｜${l.memo}` : '');
    const st = li.querySelector('.st');
    st.textContent = l.status;
    st.classList.toggle('ok', l.status === '核准');
    st.classList.toggle('no', l.status === '駁回');
    ul.appendChild(li);
  });
}

/* ---------- 薪資總覽 ---------- */
const money = (n) => (Math.round(Number(n) || 0)).toLocaleString('zh-TW');
const hrs = (n) => (Number(n) || 0) ? `${Number(n)}h` : '0';

async function loadPay(month){
  $('payBody').innerHTML = '<p class="muted" style="text-align:center">讀取中…</p>';
  let r;
  try{ r = await api('payroll', { month }); }
  catch(e){ $('payBody').innerHTML = ''; const p = document.createElement('p'); p.className = 'muted'; p.textContent = e.message; $('payBody').append(p); return; }
  const sel = $('payMonth');
  sel.innerHTML = '';
  if (!r.months.length){
    sel.hidden = true;
    $('payBody').innerHTML = '<p class="muted" style="text-align:center">還沒有產生任何月份的薪資。<br>請在試算表選單按「打卡系統 → 產生上月薪資」。</p>';
    return;
  }
  sel.hidden = false;
  r.months.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m.replace('-', ' 年 ') + ' 月'; sel.appendChild(o); });
  sel.value = r.month;
  $('payGen').textContent = r.generated ? `更新於 ${r.generated.slice(5)}` : '';
  renderPay(r.rows);
}
$('payMonth').onchange = () => loadPay($('payMonth').value);

function renderPay(rows){
  const box = $('payBody');
  box.innerHTML = '';
  const tot = rows.reduce((a, x) => a + (Number(x['實發金額']) || 0), 0);
  const ot = rows.reduce((a, x) => a + (Number(x['加班費']) || 0), 0);
  const t = document.createElement('div');
  t.className = 'paytot';
  t.innerHTML = '<div><span>實發合計</span><b></b></div><div><span>加班費合計</span><b></b></div>';
  t.querySelectorAll('b')[0].textContent = money(tot);
  t.querySelectorAll('b')[1].textContent = money(ot);
  box.append(t);

  const ul = document.createElement('ul');
  ul.className = 'paylist';
  rows.forEach(x => {
    const li = document.createElement('li');
    const d = document.createElement('details');
    d.innerHTML = '<summary><span class="n"></span><span class="net"></span></summary><div class="paydet"></div>';
    d.querySelector('.n').textContent = x['姓名'] || '';
    const sm = document.createElement('small'); sm.textContent = x['員工編號'] || ''; d.querySelector('.n').append(sm);
    d.querySelector('.net').textContent = money(x['實發金額']);
    const det = d.querySelector('.paydet');
    const plus = [['本薪','本薪'],['伙食津貼','伙食津貼'],['其他津貼','其他津貼'],['全勤獎金','全勤獎金'],['加班費','加班費'],['油資','油資'],['其他加項','其他加項']];
    const minus = [['遲到早退','遲到早退扣款'],['請假','請假扣款'],['曠職','曠職扣款'],['勞保','勞保'],['健保','健保'],['其他扣項','其他扣項']];
    const col = (title, list, sumKey) => {
      const c = document.createElement('div');
      const h = document.createElement('h4'); h.textContent = title; c.append(h);
      list.forEach(([label, key]) => {
        const v = Number(x[key]) || 0;
        if (!v && label !== '本薪') return;
        const kv = document.createElement('div'); kv.className = 'kv';
        kv.innerHTML = '<span></span><b></b>';
        kv.children[0].textContent = label; kv.children[1].textContent = money(v);
        c.append(kv);
      });
      const s = document.createElement('div'); s.className = 'kv sum'; s.innerHTML = '<span></span><b></b>';
      s.children[0].textContent = sumKey; s.children[1].textContent = money(x[sumKey]);
      c.append(s);
      return c;
    };
    det.append(col('應發', plus, '應發合計'), col('應扣', minus, '應扣合計'));
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = `加班：平日 ${hrs(x['平日加班(h)'])}、休息日 ${hrs(x['休息日加班(h)'])}、假日 ${hrs(x['假日出勤(h)'])}　遲到早退 ${Number(x['遲到早退(分)']) || 0} 分　油程 ${Number(x['油程(km)']) || 0} km`;
    det.append(meta);
    if (x['備註']){ const n = document.createElement('div'); n.className = 'note'; n.textContent = x['備註']; det.append(n); }
    li.append(d); ul.append(li);
  });
  box.append(ul);
}

/* ---------- 畫面 ---------- */
function setRecords(rec){
  S.records = rec || { punches:[], inspections:[], otOpen:false };
  const items = [
    ...S.records.punches.map(p => ({
      time:p.time,
      text:(p.category && p.category !== '正常' ? p.category.replace('加班','') : '') + p.type,
      note:p.note, cls:(p.note || '').startsWith('外勤') ? 'remote' : '',
    })),
    ...S.records.inspections.map(i => ({
      time:i.time,
      text:`巡檢 ${i.machine}`,
      note:i.result === '異常' ? '異常' + (i.issues ? '：' + i.issues : '') : '正常',
      cls:i.result === '異常' ? 'bad' : '',
    })),
  ].sort((a, b) => a.time.localeCompare(b.time));

  const ul = $('records');
  ul.innerHTML = '';
  if (!items.length) ul.innerHTML = '<li class="empty">今天還沒有紀錄</li>';
  items.forEach(it => {
    const li = document.createElement('li');
    li.className = it.cls;
    li.innerHTML = '<span class="t"></span><span class="d"></span>';
    li.querySelector('.t').textContent = it.time;
    li.querySelector('.d').textContent = it.text + (it.note ? ' · ' + it.note : '');
    ul.appendChild(li);
  });

  // 提示下一步要按哪個
  const done = S.records.punches.map(p => p.type);
  let next = null;
  if (S.dayType !== '假日'){
    next = [T.IN, T.LUNCH_OUT, T.LUNCH_IN, T.OUT].find(t => !done.includes(t)) || null;
  }
  const otNext = S.records.otOpen ? T.OT_OUT : null;
  document.querySelectorAll('[data-type]').forEach(b => {
    b.classList.toggle('next', b.dataset.type === next || b.dataset.type === otNext);
  });

  const last = S.records.punches[S.records.punches.length - 1];
  $('status').textContent = S.records.otOpen ? '⏱ 加班進行中'
    : last ? `最後打卡：${last.type} ${last.time}` : '今日尚未打卡';
}

function tick(){
  $('clock').textContent = new Date().toLocaleTimeString('zh-TW', { hour12:false, timeZone:'Asia/Taipei' });
}

function show(id, on){ $(id).hidden = !on; }

let toastTimer;
function toast(msg, kind = ''){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = kind; }, kind === 'err' ? 5000 : 3500);
}

function fatal(msg){
  show('mainView', false); show('bindView', false); show('loading', true);
  $('loadingMsg').innerHTML = '';
  const p = document.createElement('p'); p.textContent = msg;
  const b = document.createElement('button'); b.className = 'block ghost'; b.textContent = '重新載入';
  b.onclick = () => location.reload();
  $('loadingMsg').append(p, b);
}
</script>
</body>
</html>
